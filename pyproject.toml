[project]
name = "laya-crypto-trainer"
version = "0.1.0"
description = "Local LAYA fine-tuning, evaluation and inference for Binance USD-M futures research (no live trading)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Official LAYA decision model, pinned for reproducibility (upstream commit recorded in docs/ARCHITECTURE.md).
    "laya==0.4.2",
    "torch>=2.5",
    "transformers>=4.48,<5",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "psutil>=5.9",
    "scikit-learn>=1.5",
    "lightgbm>=4.7",
    "xgboost>=2.1",
    "optuna>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
laya-crypto = "laya_crypto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_crypto"]

# CUDA wheels on Windows (cu128 covers RTX 20xx through RTX 50xx), CPU wheels on Linux/macOS
# for development and CI. Change the Windows index in one place if your driver is older.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs public internet (Binance archive / Hugging Face)",
    "laya: loads the real LAYA checkpoint (downloads ~ hundreds of MB once)",
]
addopts = "-m 'not network and not laya'"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
